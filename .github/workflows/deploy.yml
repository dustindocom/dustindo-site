# Publishes the site to GitHub Pages: the code from main plus the music data from the charts branch.
# Runs when you push to main, when "Refresh charts" commits new data, or by hand.
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Deploy site
on:
  push: { branches: [main] }
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: { group: pages, cancel-in-progress: true }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Add the music data from the charts branch
        uses: actions/checkout@v4
        with: { ref: charts, path: va/data }
      - run: rm -rf va/data/.git .claude
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deploy
        uses: actions/deploy-pages@v4
