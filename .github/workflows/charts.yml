name: Refresh charts
on:
  schedule: [{ cron: '17 */6 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: va
jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-charts.mjs
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "va-charts-bot"
          git config user.email "va-charts-bot@users.noreply.github.com"
          git add data/charts.json
          git diff --cached --quiet || (git commit -m "Refresh charts" && git push)
