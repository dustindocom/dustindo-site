# Rebuilds the music catalog every 6 hours.
# The data is committed to the `charts` branch (never to main), then the site is redeployed.
name: Refresh charts
on:
  schedule: [{ cron: '17 */6 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: charts, cancel-in-progress: false }
jobs:
  charts:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Get the current music data from the charts branch
        uses: actions/checkout@v4
        with: { ref: charts, path: va/data }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-charts.mjs
        working-directory: va
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
      - name: Commit to the charts branch if changed
        id: commit
        working-directory: va/data
        run: |
          git config user.name "va-charts-bot"
          git config user.email "va-charts-bot@users.noreply.github.com"
          git add charts.json crawl.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh charts" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: charts
    if: needs.charts.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
